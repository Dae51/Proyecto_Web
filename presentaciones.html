<!DOCTYPE html>
<html lang="en">

<head>

    <header>
        <div class="navbar-container">
            <div class="navbar-brand">
                <img src="./img/logo_queen.png" alt="Logo Queen" class="logo">
            </div>
            
            <button class="hamburger" id="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <nav class="navbar-menu" id="navbarMenu">
                <ul class="nav-list">
                    <li class="nav-item"><a href="./index.html" class="nav-link">Inicio</a></li>
                    <li class="nav-item"><a href="./noticias.html" class="nav-link">Noticias</a></li>
                    <li class="nav-item"><a href="./Integrantes.html" class="nav-link">Integrantes</a></li>
                    <li class="nav-item"><a href="./presentaciones.html" class="nav-link">Calendario</a></li>
                    <li class="nav-item"><a href="./Discografia.html" class="nav-link">Discografía</a></li>

                </ul>
            </nav>
        </div>
    </header>


    <main>
        <section>
            
        </section>
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="menu-icon">
                <span></span>
                <span></span>
                <span></span>
            </div>

            <div class="current-day">
                <div class="day-number" id="currentDay">05</div>
                <div class="day-name" id="currentDayName">DOMINGO</div>
            </div>

            <div class="section-title">Presentaciones de Queen</div>
            <ul class="event-list" id="currentEvents">
                <li class="event-item">Evento de prueba</li>
                <li class="event-item">Live Aid</li>
            </ul>
            
            <button class="create-event-btn">Create an Event</button>
        </aside>

        <!-- Calendario principal -->
        <div class="calendar-content">
            <div class="year-nav">
                <button id="prevYear">◄</button>
                <h2 id="currentYear">2025</h2>
                <button id="nextYear">►</button>
            </div>

            <div class="month-nav" id="monthNav"></div>

            <div id="calendar"></div>
        </div>
    </main>




    <!-- FullCalendar JS -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
